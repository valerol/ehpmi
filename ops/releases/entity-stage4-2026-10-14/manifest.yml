changes:
  - Library and type Pages query published Materials 12 per page in deterministic date DESC, ID DESC order.
  - Material cards use a semantic heading and exactly one primary file link containing the decorative thumbnail and visible title.
  - File labels are derived from attachment MIME type and physical file size.
  - Missing or unresolved files remain visible without a link and show the exact text File temporarily unavailable.
  - The ACF File field permits incomplete Draft saves, but is required before Publish and when updating an already published Material; Admin list and edit screens flag unavailable published files without changing content.
  - Root and type pagination use Page-owned rewrite rules and self-canonical paginated URLs.
  - Grid styling preserves left alignment of partial rows and a single-column mobile layout.
